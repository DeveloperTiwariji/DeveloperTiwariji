<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="260" viewBox="0 0 1200 260" role="img" aria-label="Satyam Tiwari - Backend Engineer | Java and Spring Boot" xmlns:c2pa="http://c2pa.org/manifest">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0F172A"/>
      <stop offset="0.5" stop-color="#312E81"/>
      <stop offset="1" stop-color="#6D28D9"/>
    </linearGradient>
    <linearGradient id="shine" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#ffffff" stop-opacity="0"/>
      <stop offset="0.5" stop-color="#ffffff" stop-opacity="0.12"/>
      <stop offset="1" stop-color="#ffffff" stop-opacity="0"/>
    </linearGradient>
    <linearGradient id="line" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#A78BFA" stop-opacity="0"/>
      <stop offset="0.5" stop-color="#C4B5FD"/>
      <stop offset="1" stop-color="#A78BFA" stop-opacity="0"/>
    </linearGradient>
    <clipPath id="clip"><rect width="1200" height="260" rx="0"/></clipPath>
  </defs>

  <g clip-path="url(#clip)">
    <rect width="1200" height="260" fill="url(#bg)"/>

    <!-- floating orbs -->
    <circle cx="140" cy="60" r="70" fill="#A78BFA" opacity="0.10">
      <animate attributeName="cy" values="60;90;60" dur="7s" repeatCount="indefinite"/>
    </circle>
    <circle cx="1040" cy="200" r="90" fill="#8B5CF6" opacity="0.12">
      <animate attributeName="cy" values="200;165;200" dur="9s" repeatCount="indefinite"/>
    </circle>
    <circle cx="880" cy="50" r="40" fill="#C4B5FD" opacity="0.10">
      <animate attributeName="cx" values="880;920;880" dur="8s" repeatCount="indefinite"/>
    </circle>
    <circle cx="300" cy="215" r="28" fill="#C4B5FD" opacity="0.12">
      <animate attributeName="cx" values="300;340;300" dur="6s" repeatCount="indefinite"/>
    </circle>

    <!-- sweeping light -->
    <rect x="-400" y="0" width="400" height="260" fill="url(#shine)">
      <animate attributeName="x" values="-400;1200" dur="6s" repeatCount="indefinite"/>
    </rect>

    <!-- title -->
    <text x="600" y="120" text-anchor="middle" font-family="'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="62" font-weight="700" fill="#FFFFFF" letter-spacing="1">
      Satyam Tiwari
      <animate attributeName="opacity" values="0;0;1" keyTimes="0;0.15;1" dur="1.4s" begin="0s" fill="freeze"/>
      <animate attributeName="y" values="140;140;120" keyTimes="0;0.15;1" dur="1.4s" begin="0s" fill="freeze"/>
    </text>

    <!-- underline -->
    <rect x="450" y="140" width="300" height="3" rx="1.5" fill="url(#line)">
      <animate attributeName="opacity" values="0;0;1" keyTimes="0;0.45;1" dur="1.8s" begin="0s" fill="freeze"/>
      <animate attributeName="width" values="0;0;300" keyTimes="0;0.45;1" dur="1.8s" begin="0s" fill="freeze"/>
    </rect>

    <!-- subtitle -->
    <text x="600" y="190" text-anchor="middle" font-family="'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="22" fill="#DDD6FE" letter-spacing="2">
      BACKEND ENGINEER  |  JAVA &amp; SPRING BOOT
      <animate attributeName="opacity" values="0;0;1" keyTimes="0;0.5;1" dur="2.4s" begin="0s" fill="freeze"/>
    </text>
  </g>
<metadata><c2pa:manifest></c2pa:manifest></metadata></svg>
